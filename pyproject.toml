[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trio-paper-experiments"
version = "1.0.0"
description = "Reproducible experiments for TRIO representation learning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.1", "scipy==1.18.1", "torch==2.5.1",
  "pandas==2.3.3", "matplotlib>=3.9,<4", "networkx==3.6.1",
  "pandapower==3.5.4", "cvxpy==1.9.2", "clarabel==0.11.1",
  "casadi==3.8.0", "pyscipopt==6.2.1"
]

[project.optional-dependencies]
gurobi = ["gurobipy==13.0.3"]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
